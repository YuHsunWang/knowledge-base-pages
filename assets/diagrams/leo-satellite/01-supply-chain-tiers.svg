<rect x="0" y="0" width="1800" height="1050" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1048" rx="22" fill="none" stroke="#e9ecf3"/>

<text x="72" y="78" font-size="22" font-weight="bold" letter-spacing="3" fill="#0369a1">SUPPLY CHAIN · 曝險分層</text>
<text x="70" y="132" font-size="46" font-weight="bold" fill="#1f2430">台股低軌衛星供應鏈：誰有真實曝險</text>
<text x="72" y="172" font-size="22" fill="#5b6472">需求端已證實；但部署量不能直接換成台廠利潤。依公開證據把台股公司分成三層</text>
<rect x="60" y="230" width="1680" height="150" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,230 h1644 a18,18 0 0 1 18,18 v6 h-1680 v-6 a18,18 0 0 1 18,-18 z" fill="#6366f1"/><text x="86" y="292" font-size="27" font-weight="bold" fill="#4338ca">需求端（已證實）</text><text x="86" y="333" font-size="20" fill="#5b6472">Starlink 公司稱 LEO 超過 11,000 顆（2026-10-06）· 訂戶 12.0 million（2026-06-30）· Amazon Leo 已發射 396 顆</text><line x1="900" y1="386" x2="900" y2="432" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><rect x="60" y="440" width="820" height="250" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,440 h784 a18,18 0 0 1 18,18 v6 h-820 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="86" y="502" font-size="27" font-weight="bold" fill="#0f766e">已受益：昇達科 3491 · LEO RF 元件</text><text x="86" y="543" font-size="20" fill="#5b6472">公司簡報揭露 2026H1 LEO 占營收 77.0%</text><text x="86" y="576" font-size="20" fill="#5b6472">H1 營收年增約 69.54%（法定月報）</text><text x="86" y="609" font-size="20" fill="#5b6472">⚠ Q3 月營收仍低於改版前基準 · PE 121.22×（10/12）</text><rect x="920" y="440" width="820" height="250" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M938,440 h784 a18,18 0 0 1 18,18 v6 h-820 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="946" y="502" font-size="27" font-weight="bold" fill="#b45309">已受益但分部數字待驗：華通 2313</text><text x="946" y="543" font-size="20" fill="#5b6472">衛星 PCB · 泰國廠月產能 40 萬平方呎（公司 5/29 簡報）</text><text x="946" y="576" font-size="20" fill="#5b6472">航太／衛星占比估約 20%（媒體／分析師估計）</text><text x="946" y="609" font-size="20" fill="#5b6472">⚠ 市占口徑不一 · 衛星分部獲利未揭露 · PE 40.58×</text><rect x="60" y="730" width="1680" height="220" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,730 h1644 a18,18 0 0 1 18,18 v6 h-1680 v-6 a18,18 0 0 1 18,-18 z" fill="#f43f5e"/><text x="86" y="792" font-size="27" font-weight="bold" fill="#be123c">概念沾邊／證據不足（12 家）</text><text x="86" y="833" font-size="20" fill="#5b6472">地面站／終端：台揚 2314 · 啟碁 6285 · 明泰 3380　上游設備：台達電 2308 · 佳世達 2352 · 同欣電 6271</text><text x="86" y="866" font-size="20" fill="#5b6472">射頻：全訊 5222 · 穩懋 3105 · 宏捷科 8086　PCB：金像電 2368　太陽能：元晶 6443 · 茂迪 6244</text><text x="86" y="899" font-size="20" fill="#5b6472">只有交易所分類或第三手名單，缺第一手認證、出貨與營收證據</text><circle cx="78" cy="1004" r="8" fill="#6366f1"/><text x="96" y="1010" font-size="21" fill="#5b6472">需求</text><circle cx="222" cy="1004" r="8" fill="#14b8a6"/><text x="240" y="1010" font-size="21" fill="#5b6472">已受益</text><circle cx="388" cy="1004" r="8" fill="#f59e0b"/><text x="406" y="1010" font-size="21" fill="#5b6472">已受益・待驗</text><circle cx="620" cy="1004" r="8" fill="#f43f5e"/><text x="638" y="1010" font-size="21" fill="#5b6472">證據不足</text></svg>