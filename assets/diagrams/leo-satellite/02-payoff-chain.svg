<rect x="0" y="0" width="1800" height="1050" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1048" rx="22" fill="none" stroke="#e9ecf3"/>

<text x="72" y="78" font-size="22" font-weight="bold" letter-spacing="3" fill="#6d28d9">PAYOFF CHAIN · 四環節</text>
<text x="70" y="132" font-size="46" font-weight="bold" fill="#1f2430">從「技術是真的」到「股價還沒反映」</text>
<text x="72" y="172" font-size="22" fill="#5b6472">每家公司都要依序過四關；任何一關過不了，就停在那裡，不往下推</text>
<rect x="60" y="220" width="390" height="100" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,220 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#6366f1"/><text x="86" y="282" font-size="27" font-weight="bold" fill="#4338ca">① 技術是真的？</text><rect x="490" y="220" width="390" height="100" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M508,220 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#0ea5e9"/><text x="516" y="282" font-size="27" font-weight="bold" fill="#0369a1">② 客戶買單？</text><rect x="920" y="220" width="390" height="100" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M938,220 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="946" y="282" font-size="27" font-weight="bold" fill="#b45309">③ 營收反映？</text><rect x="1350" y="220" width="390" height="100" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1368,220 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#8b5cf6"/><text x="1376" y="282" font-size="27" font-weight="bold" fill="#6d28d9">④ 股價還沒反映？</text><line x1="456" y1="270" x2="482" y2="270" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="886" y1="270" x2="912" y2="270" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="1316" y1="270" x2="1342" y2="270" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><text x="64" y="384" font-size="26" font-weight="bold" fill="#1f2430">昇達科 3491</text><rect x="60" y="400" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,400 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="86" y="462" font-size="27" font-weight="bold" fill="#0f766e">過</text><text x="86" y="503" font-size="20" fill="#5b6472">營收高成長</text><text x="86" y="536" font-size="20" fill="#5b6472">不只是送樣</text><rect x="490" y="400" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M508,400 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="516" y="462" font-size="27" font-weight="bold" fill="#b45309">有疑問</text><text x="516" y="503" font-size="20" fill="#5b6472">自稱在手訂單約 18 億</text><text x="516" y="536" font-size="20" fill="#5b6472">但客戶改版延後</text><rect x="920" y="400" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M938,400 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="946" y="462" font-size="27" font-weight="bold" fill="#0f766e">過</text><text x="946" y="503" font-size="20" fill="#5b6472">H1 年增約 69.54%</text><text x="946" y="536" font-size="20" fill="#5b6472">但 Q3 仍低於基準</text><rect x="1350" y="400" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1368,400 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f43f5e"/><text x="1376" y="462" font-size="27" font-weight="bold" fill="#be123c">不過</text><text x="1376" y="503" font-size="20" fill="#5b6472">PE 121.22×（10/12）</text><text x="1376" y="536" font-size="20" fill="#5b6472">成長已高度反映</text><text x="64" y="684" font-size="26" font-weight="bold" fill="#1f2430">華通 2313</text><rect x="60" y="700" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,700 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="86" y="762" font-size="27" font-weight="bold" fill="#0f766e">過</text><text x="86" y="803" font-size="20" fill="#5b6472">報導供應 Starlink</text><text x="86" y="836" font-size="20" fill="#5b6472">與 Kuiper</text><rect x="490" y="700" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M508,700 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="516" y="762" font-size="27" font-weight="bold" fill="#b45309">有疑問</text><text x="516" y="803" font-size="20" fill="#5b6472">有擴產</text><text x="516" y="836" font-size="20" fill="#5b6472">缺訂單量與合約</text><rect x="920" y="700" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M938,700 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="946" y="762" font-size="27" font-weight="bold" fill="#b45309">有疑問</text><text x="946" y="803" font-size="20" fill="#5b6472">全公司已驗證</text><text x="946" y="836" font-size="20" fill="#5b6472">衛星分部是估計</text><rect x="1350" y="700" width="390" height="200" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1368,700 h354 a18,18 0 0 1 18,18 v6 h-390 v-6 a18,18 0 0 1 18,-18 z" fill="#f43f5e"/><text x="1376" y="762" font-size="27" font-weight="bold" fill="#be123c">無法判斷</text><text x="1376" y="803" font-size="20" fill="#5b6472">有當日 PE 40.58×</text><text x="1376" y="836" font-size="20" fill="#5b6472">缺衛星分部獲利</text><circle cx="78" cy="1004" r="8" fill="#14b8a6"/><text x="96" y="1010" font-size="21" fill="#5b6472">通過</text><circle cx="222" cy="1004" r="8" fill="#f59e0b"/><text x="240" y="1010" font-size="21" fill="#5b6472">有疑問</text><circle cx="388" cy="1004" r="8" fill="#f43f5e"/><text x="406" y="1010" font-size="21" fill="#5b6472">不過／無法判斷</text></svg>