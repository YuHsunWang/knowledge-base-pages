<rect x="60" y="230" width="540" height="250" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M78,230 h504 a18,18 0 0 1 18,18 v6 h-540 v-6 a18,18 0 0 1 18,-18 z" fill="#f43f5e"/><text x="86" y="292" font-size="27" font-weight="bold" fill="#be123c">Bear 35%</text><text x="86" y="333" font-size="20" fill="#5b6472">合規產能可快速複製</text><text x="86" y="366" font-size="20" fill="#5b6472">華通市占口徑收窄</text><text x="86" y="399" font-size="20" fill="#5b6472">擴產帶來價格競爭</text><rect x="630" y="230" width="540" height="250" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M648,230 h504 a18,18 0 0 1 18,18 v6 h-540 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="656" y="292" font-size="27" font-weight="bold" fill="#b45309">Base 45%</text><text x="656" y="333" font-size="20" fill="#5b6472">「非中非台」要求延續</text><text x="656" y="366" font-size="20" fill="#5b6472">華通維持主要供應位置</text><text x="656" y="399" font-size="20" fill="#5b6472">定價權仍未證實</text><rect x="1200" y="230" width="540" height="250" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1218,230 h504 a18,18 0 0 1 18,18 v6 h-540 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="1226" y="292" font-size="27" font-weight="bold" fill="#0f766e">Bull 20%</text><text x="1226" y="333" font-size="20" fill="#5b6472">合規＋長認證難複製</text><text x="1226" y="366" font-size="20" fill="#5b6472">華通持續吃到部署量</text><text x="1226" y="399" font-size="20" fill="#5b6472">長認證仍是待證假設</text><rect x="60" y="520" width="1680" height="150" rx="16" fill="#f5f3ff" stroke="#e3dcff" filter="url(#soft)"/><text x="88" y="564" font-size="24" font-weight="bold" fill="#6d28d9">唯一會讓護城河論點失效的假設</text><text x="88" y="600" font-size="20" fill="#5b6472">客戶不再要求「非中非台」，或合規、已認證的東南亞衛星 PCB 產能不再稀缺</text><text x="88" y="628" font-size="20" fill="#5b6472">機率是主觀情境，不是事實；用途是看結論對假設有多敏感</text><rect x="60" y="710" width="1680" height="190" rx="16" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><text x="88" y="754" font-size="24" font-weight="bold" fill="#1f2430">四個檢查點（事先登記，到期對答案）</text><text x="88" y="790" font-size="20" fill="#5b6472">2026-10　時程：Q3 至少一個月回到約 3.49 億元？→ 七～九月全低於門檻；訂單下修未確認</text><text x="88" y="818" font-size="20" fill="#5b6472">2026-10　定價：本益比仍反映高成長？→ 10/12 PE 121.22×</text><text x="88" y="846" font-size="20" fill="#5b6472">2026-11　耐久性：華通泰國產能連得到衛星營收？　證據邊界：其他公司拿出第一手證據？</text></svg>