<title id="roadmap-title">DA 到 DE 學習地圖</title>
<desc id="roadmap-desc">從基礎工具箱、建模、第一條 pipeline 與雲端工程化，依資料量或即時需求選擇 Spark、Kafka，再走向 Lakehouse 與作品集；還不用時先深化現有水管，直接準備作品集。</desc>
