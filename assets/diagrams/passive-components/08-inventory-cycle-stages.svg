<rect x="0" y="0" width="1800" height="1200" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1198" rx="22" fill="none" stroke="#e9ecf3"/>
<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="70" y="112" font-size="46" fill="#1f2430" font-weight="bold" text-anchor="start">被動元件景氣循環五階段</text><rect x="60" y="245" width="312" height="575" rx="20" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M80,245 h272 a20,20 0 0 1 20,20 v8 h-312 v-8 a20,20 0 0 1 20,-20 z" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="82" y="317" font-size="23" fill="#b91c1c" font-weight="bold" text-anchor="start">1. 過熱 Overbooking</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="82" y="364" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">訊號：</text><circle cx="88" cy="396" r="4.5" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="102" y="403" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">現貨溢價 &gt;10%</text><circle cx="88" cy="433" r="4.5" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="102" y="440" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">Lead time 拉長至 20 週以上</text><circle cx="88" cy="470" r="4.5" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="102" y="477" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">客戶 double order</text><circle cx="88" cy="507" r="4.5" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="102" y="514" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">稼動率 90-95%</text><circle cx="88" cy="544" r="4.5" fill="#ef4444"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="102" y="551" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">新 Capex 公告</text><rect x="78" y="647" width="276" height="142" rx="14" fill="#fff1f2" stroke="#ef4444" stroke-opacity="0.35"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="94" y="681" font-size="18" fill="#b91c1c" font-weight="bold" text-anchor="start">法說語氣：</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="94" y="719" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">「需求強勁，產能供不應求，</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="94" y="749" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">ASP 調升。」</text><rect x="402" y="245" width="312" height="575" rx="20" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M422,245 h272 a20,20 0 0 1 20,20 v8 h-312 v-8 a20,20 0 0 1 20,-20 z" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="424" y="317" font-size="23" fill="#b45309" font-weight="bold" text-anchor="start">2. 轉折 Inventory Peak</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="424" y="364" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">訊號：</text><circle cx="430" cy="396" r="4.5" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="444" y="403" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">現貨溢價縮小</text><circle cx="430" cy="433" r="4.5" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="444" y="440" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">代理庫存轉增</text><circle cx="430" cy="470" r="4.5" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="444" y="477" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">Lead time 開始縮短</text><circle cx="430" cy="507" r="4.5" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="444" y="514" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">終端季節性不如預期</text><rect x="420" y="647" width="276" height="142" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-opacity="0.35"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="436" y="681" font-size="18" fill="#b45309" font-weight="bold" text-anchor="start">法說語氣：</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="436" y="719" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">「庫存健康，但需持續</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="436" y="749" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">觀察通路端。」</text><rect x="744" y="245" width="312" height="575" rx="20" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M764,245 h272 a20,20 0 0 1 20,20 v8 h-312 v-8 a20,20 0 0 1 20,-20 z" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="766" y="317" font-size="23" fill="#475569" font-weight="bold" text-anchor="start">3. 衰退 Destocking</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="766" y="364" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">訊號：</text><circle cx="772" cy="396" r="4.5" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="786" y="403" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">月營收 MoM 連續下滑</text><circle cx="772" cy="433" r="4.5" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="786" y="440" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">月營收 YoY 轉負</text><circle cx="772" cy="470" r="4.5" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="786" y="477" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">毛利率快速下墜</text><circle cx="772" cy="507" r="4.5" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="786" y="514" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">稼動率跌破 70%</text><circle cx="772" cy="544" r="4.5" fill="#64748b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="786" y="551" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">現貨跌破合約價</text><rect x="762" y="647" width="276" height="142" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-opacity="0.35"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="778" y="681" font-size="18" fill="#475569" font-weight="bold" text-anchor="start">法說語氣：</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="778" y="719" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">「客戶積極去化庫存，</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="778" y="749" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">能見度低，短期保守。」</text><rect x="1086" y="245" width="312" height="575" rx="20" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1106,245 h272 a20,20 0 0 1 20,20 v8 h-312 v-8 a20,20 0 0 1 20,-20 z" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1108" y="317" font-size="23" fill="#0369a1" font-weight="bold" text-anchor="start">4. 築底 Bottoming</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1108" y="364" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">訊號：</text><circle cx="1114" cy="396" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1128" y="403" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">月營收 MoM 跌幅收斂</text><circle cx="1114" cy="433" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1128" y="440" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">代理商庫存天數探底</text><circle cx="1114" cy="470" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1128" y="477" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">稼動率止跌未拉升</text><circle cx="1114" cy="507" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1128" y="514" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">Lead time 趨穩</text><rect x="1104" y="647" width="276" height="142" rx="14" fill="#f0f9ff" stroke="#0ea5e9" stroke-opacity="0.35"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1120" y="681" font-size="18" fill="#0369a1" font-weight="bold" text-anchor="start">法說語氣：</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1120" y="719" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">「底部訊號出現，但復甦</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1120" y="749" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">時間點不確定。」</text><rect x="1428" y="245" width="312" height="575" rx="20" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1448,245 h272 a20,20 0 0 1 20,20 v8 h-312 v-8 a20,20 0 0 1 20,-20 z" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1450" y="317" font-size="23" fill="#15803d" font-weight="bold" text-anchor="start">5. 復甦 Early Recovery</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1450" y="364" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="start">訊號：</text><circle cx="1456" cy="396" r="4.5" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1470" y="403" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">急單出現</text><circle cx="1456" cy="433" r="4.5" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1470" y="440" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">月營收連 2-3 月正成長</text><circle cx="1456" cy="470" r="4.5" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1470" y="477" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">ASP 止跌</text><circle cx="1456" cy="507" r="4.5" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1470" y="514" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">稼動率回升至 75-80%</text><circle cx="1456" cy="544" r="4.5" fill="#22c55e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1470" y="551" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="start">Capex 重啟</text><rect x="1446" y="647" width="276" height="142" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-opacity="0.35"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1462" y="681" font-size="18" fill="#15803d" font-weight="bold" text-anchor="start">法說語氣：</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1462" y="719" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">「需求回溫，庫存調整</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1462" y="749" font-size="17" fill="#1f2430" font-weight="normal" text-anchor="start">接近尾聲。」</text><line x1="366" y1="882" x2="408" y2="882" stroke="#8a93a6" stroke-width="4" marker-end="url(#aFaint)"/><line x1="708" y1="882" x2="750" y2="882" stroke="#8a93a6" stroke-width="4" marker-end="url(#aFaint)"/><line x1="1050" y1="882" x2="1092" y2="882" stroke="#8a93a6" stroke-width="4" marker-end="url(#aFaint)"/><line x1="1392" y1="882" x2="1434" y2="882" stroke="#8a93a6" stroke-width="4" marker-end="url(#aFaint)"/><path d="M1584.0,882 L1584.0,995 L216.0,995 L216.0,882" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#aViolet)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="900.0" y="980" font-size="24" fill="#6d28d9" font-weight="bold" text-anchor="middle">循環</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="900.0" y="1100" font-size="27" fill="#1f2430" font-weight="bold" text-anchor="middle">被動元件景氣通常落後電子供應鏈 1-2 個季度，且因牛鞭效應而放大。</text></svg>