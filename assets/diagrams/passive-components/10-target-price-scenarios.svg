<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" font-family="Microsoft JhengHei, 微軟正黑體, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#f3f5f9"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#27324a" flood-opacity="0.10"/>
  </filter>
  <marker id="aFaint" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L9,4 L0,8 Z" fill="#8a93a6"/>
  </marker>
  <marker id="aViolet" markerWidth="12" markerHeight="12" refX="8" refY="4.2" orient="auto">
    <path d="M0,0 L9.5,4.2 L0,8.4 Z" fill="#8b5cf6"/>
  </marker>
</defs>
<rect x="0" y="0" width="1800" height="1180" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1178" rx="22" fill="none" stroke="#e9ecf3"/>
<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="70" y="112" font-size="46" fill="#1f2430" font-weight="bold" text-anchor="start">目標價的三段拆解</text><rect x="70" y="230" width="490" height="400" rx="22" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M92,230 h446 a22,22 0 0 1 22,22 v8 h-490 v-8 a22,22 0 0 1 22,-22 z" fill="#0ea5e9"/><circle cx="128" cy="314" r="30" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="128" y="324" font-size="29" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175" y="324" font-size="28" fill="#0369a1" font-weight="bold" text-anchor="start">建立 EPS 基礎</text><circle cx="112" cy="383" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="128" y="390" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">落後 / 當年年化 / 正常化 三種並列</text><circle cx="112" cy="430" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="128" y="437" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">再做品質調整</text><circle cx="112" cy="477" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="128" y="484" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">業外、非控制權益</text><circle cx="112" cy="524" r="4.5" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="128" y="531" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">併購併表、股本稀釋</text><rect x="655" y="230" width="490" height="400" rx="22" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M677,230 h446 a22,22 0 0 1 22,22 v8 h-490 v-8 a22,22 0 0 1 22,-22 z" fill="#8b5cf6"/><circle cx="713" cy="314" r="30" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="324" font-size="29" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="760" y="324" font-size="28" fill="#6d28d9" font-weight="bold" text-anchor="start">選估值錨與倍數</text><circle cx="697" cy="383" r="4.5" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="390" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">逐家分流</text><circle cx="697" cy="430" r="4.5" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="437" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">國巨 EV/EBITDA+SOTP</text><circle cx="697" cy="477" r="4.5" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="484" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">華新科 P/B band</text><circle cx="697" cy="524" r="4.5" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="531" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">禾伸堂分部估值</text><circle cx="697" cy="571" r="4.5" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="713" y="578" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">大毅轉型後正常化 EPS</text><rect x="1240" y="230" width="490" height="400" rx="22" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1262,230 h446 a22,22 0 0 1 22,22 v8 h-490 v-8 a22,22 0 0 1 22,-22 z" fill="#14b8a6"/><circle cx="1298" cy="314" r="30" fill="#14b8a6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1298" y="324" font-size="29" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1345" y="324" font-size="28" fill="#0f766e" font-weight="bold" text-anchor="start">情境化與反推</text><circle cx="1282" cy="383" r="4.5" fill="#14b8a6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1298" y="390" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">三情境目標價矩陣</text><circle cx="1282" cy="430" r="4.5" fill="#14b8a6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1298" y="437" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">用股價反推隱含假設</text><circle cx="1282" cy="477" r="4.5" fill="#14b8a6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1298" y="484" font-size="20" fill="#5b6472" font-weight="normal" text-anchor="start">寫下失效條件</text><line x1="572" y1="430" x2="637" y2="430" stroke="#8a93a6" stroke-width="5" marker-end="url(#aFaint)"/><line x1="1157" y1="430" x2="1222" y2="430" stroke="#8a93a6" stroke-width="5" marker-end="url(#aFaint)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="261" y="738" font-size="22" fill="#be123c" font-weight="bold" text-anchor="end">空方</text><rect x="295" y="700" width="280" height="52" rx="14" fill="#fee2e2" stroke="#be123c" stroke-opacity="0.45"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="261" y="810" font-size="22" fill="#b45309" font-weight="bold" text-anchor="end">基準</text><rect x="295" y="772" width="390" height="52" rx="14" fill="#fef3c7" stroke="#b45309" stroke-opacity="0.45"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="261" y="882" font-size="22" fill="#15803d" font-weight="bold" text-anchor="end">多方</text><rect x="295" y="844" width="500" height="52" rx="14" fill="#dcfce7" stroke="#15803d" stroke-opacity="0.45"/><rect x="900" y="704" width="800" height="190" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="3" filter="url(#soft)"/><circle cx="958" cy="766" r="26" fill="#f43f5e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="958" y="775" font-size="31" fill="#ffffff" font-weight="bold" text-anchor="middle">!</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1004" y="762" font-size="25" fill="#be123c" font-weight="bold" text-anchor="start">最常見的錯：用景氣高點的 EPS，</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1004" y="807" font-size="25" fill="#be123c" font-weight="bold" text-anchor="start">再給景氣高點的倍數 -</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1004" y="852" font-size="25" fill="#be123c" font-weight="bold" text-anchor="start">目標價被放大兩次。</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="900.0" y="1060" font-size="29" fill="#1f2430" font-weight="bold" text-anchor="middle">週期股的目標價不是一個數字，是一組帶條件的情境。</text></svg>