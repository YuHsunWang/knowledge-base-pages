<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" font-family="Microsoft JhengHei, 微軟正黑體, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#f3f5f9"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#27324a" flood-opacity="0.10"/>
  </filter>
  <marker id="aFaint" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L9,4 L0,8 Z" fill="#8a93a6"/>
  </marker>
  <marker id="aViolet" markerWidth="12" markerHeight="12" refX="8" refY="4.2" orient="auto">
    <path d="M0,0 L9.5,4.2 L0,8.4 Z" fill="#8b5cf6"/>
  </marker>
</defs>
<rect x="0" y="0" width="1800" height="1080" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1078" rx="22" fill="none" stroke="#e9ecf3"/>
<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="70" y="112" font-size="46" fill="#1f2430" font-weight="bold" text-anchor="start">景氣位置 × 估值判斷矩陣</text><rect x="70" y="220" width="210" height="72" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175.0" y="266" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">景氣階段</text><rect x="280" y="220" width="210" height="72" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="385.0" y="266" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">P/B</text><rect x="490" y="220" width="300" height="72" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="640.0" y="266" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">預估 PE 表象</text><rect x="790" y="220" width="590" height="72" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1085.0" y="266" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">正確解讀</text><rect x="1380" y="220" width="300" height="72" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1530.0" y="266" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">動作</text><rect x="70" y="292" width="210" height="126" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175.0" y="364" font-size="20" fill="#be123c" font-weight="bold" text-anchor="middle">過熱</text><rect x="280" y="292" width="210" height="126" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="385.0" y="364" font-size="20" fill="#be123c" font-weight="bold" text-anchor="middle">高（紅區）</text><rect x="490" y="292" width="300" height="126" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="640.0" y="364" font-size="20" fill="#be123c" font-weight="bold" text-anchor="middle">看似低（峰值E）</text><rect x="790" y="292" width="590" height="126" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1085.0" y="364" font-size="21" fill="#be123c" font-weight="bold" text-anchor="middle">最危險：用峰值E算便宜是假象</text><rect x="1380" y="292" width="300" height="126" fill="#fff1f2" stroke="#fecdd3" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1530.0" y="364" font-size="20" fill="#be123c" font-weight="bold" text-anchor="middle">減碼/避開</text><rect x="70" y="418" width="210" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175.0" y="490" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="middle">衰退/去庫</text><rect x="280" y="418" width="210" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="385.0" y="490" font-size="20" fill="#1f2430" font-weight="normal" text-anchor="middle">下殺</text><rect x="490" y="418" width="300" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="640.0" y="490" font-size="20" fill="#1f2430" font-weight="normal" text-anchor="middle">飆高（E崩）</text><rect x="790" y="418" width="590" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1085.0" y="490" font-size="21" fill="#1f2430" font-weight="normal" text-anchor="middle">PE 高是 E 崩，不代表貴</text><rect x="1380" y="418" width="300" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1530.0" y="490" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="middle">觀察、分批佈局起點</text><rect x="70" y="544" width="210" height="126" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175.0" y="616" font-size="20" fill="#15803d" font-weight="bold" text-anchor="middle">築底</text><rect x="280" y="544" width="210" height="126" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="385.0" y="616" font-size="20" fill="#15803d" font-weight="bold" text-anchor="middle">歷史低位</text><rect x="490" y="544" width="300" height="126" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="640.0" y="616" font-size="20" fill="#15803d" font-weight="bold" text-anchor="middle">極高或轉虧</text><rect x="790" y="544" width="590" height="126" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1085.0" y="616" font-size="21" fill="#15803d" font-weight="bold" text-anchor="middle">最佳風險報酬區</text><rect x="1380" y="544" width="300" height="126" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1530.0" y="616" font-size="20" fill="#15803d" font-weight="bold" text-anchor="middle">分批買進</text><rect x="70" y="670" width="210" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="175.0" y="742" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="middle">復甦初期</text><rect x="280" y="670" width="210" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="385.0" y="742" font-size="20" fill="#1f2430" font-weight="normal" text-anchor="middle">中低-&gt;回升</text><rect x="490" y="670" width="300" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="640.0" y="742" font-size="20" fill="#1f2430" font-weight="normal" text-anchor="middle">開始回落</text><rect x="790" y="670" width="590" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1085.0" y="742" font-size="21" fill="#1f2430" font-weight="normal" text-anchor="middle">正常化 PE 合理</text><rect x="1380" y="670" width="300" height="126" fill="#ffffff" stroke="#e6e8ef" stroke-width="1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1530.0" y="742" font-size="20" fill="#1f2430" font-weight="bold" text-anchor="middle">加碼/續抱</text><rect x="190" y="854" width="1420" height="120" rx="20" fill="#fff1f2" stroke="#fecdd3" stroke-width="3" filter="url(#soft)"/><circle cx="245" cy="914" r="25" fill="#f43f5e"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="245" y="923" font-size="31" fill="#ffffff" font-weight="bold" text-anchor="middle">!</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="285" y="924" font-size="27" fill="#be123c" font-weight="bold" text-anchor="start">PE 陷阱：景氣高點 EPS 最高、PE 看似最低，那通常是最危險的買點。</text></svg>