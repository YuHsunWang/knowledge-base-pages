<text x="72" y="78" font-size="22" font-weight="bold" letter-spacing="3" fill="#be123c">CVS-RADAR · TRUST</text>
<text x="70" y="132" font-size="46" font-weight="bold" fill="#1f2430">可信度與假評論處理</text>
<text x="72" y="172" font-size="22" fill="#5b6472">以弱訊號累積可疑分，只做內部降權，不公開點名</text>
<rect x="80" y="360" width="275" height="165" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M98,360 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#0ea5e9"/><text x="106" y="422" font-size="27" font-weight="bold" fill="#0369a1">每則留言</text><text x="106" y="463" font-size="20" fill="#5b6472">帳號、時間</text><text x="106" y="496" font-size="20" fill="#5b6472">推噓與文字</text><rect x="430" y="360" width="275" height="165" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M448,360 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text x="456" y="422" font-size="27" font-weight="bold" fill="#b45309">活動量門檻</text><text x="456" y="463" font-size="20" fill="#5b6472">先檢查樣本厚度</text><text x="456" y="496" font-size="20" fill="#5b6472">避免精確假象</text><rect x="780" y="360" width="275" height="165" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M798,360 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="806" y="422" font-size="27" font-weight="bold" fill="#0f766e">帳號品牌偏好輪廓</text><text x="806" y="463" font-size="20" fill="#5b6472">看長期趨勢</text><text x="806" y="496" font-size="20" fill="#5b6472">不看單句定罪</text><rect x="1110" y="360" width="275" height="165" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1128,360 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text x="1136" y="422" font-size="27" font-weight="bold" fill="#0f766e">弱訊號</text><text x="1136" y="463" font-size="20" fill="#5b6472">貼文樣板化</text><text x="1136" y="496" font-size="20" fill="#5b6472">短時爆量</text><rect x="1430" y="360" width="275" height="165" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M1448,360 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#f43f5e"/><text x="1456" y="422" font-size="27" font-weight="bold" fill="#be123c">可疑分</text><text x="1456" y="463" font-size="20" fill="#5b6472">累積風險</text><text x="1456" y="496" font-size="20" fill="#5b6472">進入權重</text><line x1="359" y1="442" x2="422" y2="442" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="709" y1="442" x2="772" y2="442" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="1059" y1="442" x2="1102" y2="442" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="1389" y1="442" x2="1422" y2="442" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><rect x="430" y="650" width="275" height="145" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M448,650 h239 a18,18 0 0 1 18,18 v6 h-275 v-6 a18,18 0 0 1 18,-18 z" fill="#0ea5e9"/><text x="456" y="712" font-size="27" font-weight="bold" fill="#0369a1">不予評分</text><text x="456" y="753" font-size="20" fill="#5b6472">低於門檻</text><text x="456" y="786" font-size="20" fill="#5b6472">不產生可疑分</text><line x1="567.5" y1="535" x2="567.5" y2="640" stroke="#8a93a6" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#aFaint)"/><text x="591.5" y="620" font-size="21" font-weight="bold" fill="#0369a1">低於門檻</text><text x="727" y="435" font-size="21" font-weight="bold" fill="#0f766e">達標</text><rect x="1110" y="650" width="595" height="145" rx="22" fill="#fff1f2" stroke="#f43f5e" stroke-width="3" filter="url(#soft)"/><text x="1142" y="708" font-size="29" font-weight="bold" fill="#be123c">內部降權</text><text x="1142" y="750" font-size="24" font-weight="bold" fill="#be123c">不對外標記個別帳號</text><line x1="1567.5" y1="535" x2="1407.5" y2="640" stroke="#f43f5e" stroke-width="2.8" marker-end="url(#aFaint)"/><circle cx="78" cy="836" r="8" fill="#0ea5e9"/><text x="96" y="842" font-size="21" fill="#5b6472">輸入 / 門檻外</text><circle cx="354" cy="836" r="8" fill="#f59e0b"/><text x="372" y="842" font-size="21" fill="#5b6472">評分前檢查</text><circle cx="564" cy="836" r="8" fill="#14b8a6"/><text x="582" y="842" font-size="21" fill="#5b6472">偏好與弱訊號</text><circle cx="796" cy="836" r="8" fill="#f43f5e"/><text x="814" y="842" font-size="21" fill="#5b6472">降權結果</text></svg>