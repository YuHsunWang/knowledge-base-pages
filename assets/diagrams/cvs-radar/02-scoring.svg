ext><text x="1296" y="436" font-size="20" fill="#5b6472">少數極端不失真</text><line x1="339" y1="387" x2="362" y2="387" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="639" y1="387" x2="662" y2="387" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="939" y1="387" x2="962" y2="387" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="1239" y1="387" x2="1262" y2="387" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="1539" y1="387" x2="1562" y2="387" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><rect x="1570" y="288" width="260" height="199" rx="24" fill="#fff7ed" stroke="#f59e0b" stroke-width="3" filter="url(#soft)"/><path d="M1594,288 h212 a24,24 0 0 1 24,24 v8 h-260 v-8 a24,24 0 0 1 24,-24 z" fill="#f59e0b"/><text x="1700.0" y="370" font-size="32" font-weight="bold" text-anchor="middle" fill="#b45309">綜合評分</text><text x="1700.0" y="412" font-size="32" font-weight="bold" text-anchor="middle" fill="#b45309">+ 信心度</text><circle cx="78" cy="546" r="8" fill="#0ea5e9"/><text x="96" y="552" font-size="21" fill="#5b6472">原始訊號</text><circle cx="266" cy="546" r="8" fill="#14b8a6"/><text x="284" y="552" font-size="21" fill="#5b6472">語意判讀</text><circle cx="454" cy="546" r="8" fill="#f59e0b"/><text x="472" y="552" font-size="21" fill="#5b6472">公平校正</text></svg>