<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="72" y="172" font-size="22" fill="#5b6472">反覆用同一門檻判定勝負，誤判風險會持續累積</text>
<line x1="235" y1="645.0" x2="1660" y2="645.0" stroke="#e6e8ef" stroke-width="2"/><line x1="235" y1="520.0" x2="1660" y2="520.0" stroke="#e6e8ef" stroke-width="2"/><line x1="235" y1="395.0" x2="1660" y2="395.0" stroke="#e6e8ef" stroke-width="2"/><line x1="235" y1="270" x2="235" y2="770" stroke="#8a93a6" stroke-width="3"/><line x1="235" y1="770" x2="1660" y2="770" stroke="#8a93a6" stroke-width="3"/><line x1="235" y1="645.0" x2="1660" y2="645.0" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 8"/><rect x="245" y="530.0" width="270" height="42" rx="10" fill="#eef2ff" stroke="#d9ddff"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="380" y="560.0" font-size="22" fill="#4338ca" font-weight="bold" text-anchor="middle">宣稱的 α = 5%</text><rect x="335.0" y="655.0" width="190" height="115.0" rx="16" fill="#14b8a6" opacity="0.88"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="430" y="635.0" font-size="28" fill="#14b8a6" font-weight="bold" text-anchor="middle">4.6%</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="430" y="818" font-size="23" fill="#1f2430" font-weight="bold" text-anchor="middle">1 次</text><rect x="685.0" y="555.0" width="190" height="215.0" rx="16" fill="#f59e0b" opacity="0.88"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="780" y="535.0" font-size="28" fill="#f59e0b" font-weight="bold" text-anchor="middle">8.6%</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="780" y="818" font-size="23" fill="#1f2430" font-weight="bold" text-anchor="middle">2 次</text><rect x="1035.0" y="407.5" width="190" height="362.5" rx="16" fill="#f59e0b" opacity="0.88"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1130" y="387.5" font-size="28" fill="#f59e0b" font-weight="bold" text-anchor="middle">14.5%</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1130" y="818" font-size="23" fill="#1f2430" font-weight="bold" text-anchor="middle">5 次</text><rect x="1385.0" y="280.0" width="190" height="490.0" rx="16" fill="#f43f5e" opacity="0.88"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1480" y="259.99999999999994" font-size="28" fill="#f43f5e" font-weight="bold" text-anchor="middle">19.6%</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1480" y="818" font-size="23" fill="#1f2430" font-weight="bold" text-anchor="middle">10 次</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="950" y="865" font-size="25" fill="#1f2430" font-weight="bold" text-anchor="middle">實驗期間檢查次數</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="95" y="525" font-size="25" fill="#1f2430" font-weight="bold" text-anchor="middle" transform="rotate(-90 95 525)">實際假陽性率</text><rect x="220" y="900" width="1360" height="90" rx="18" fill="#fff7f8" stroke="#f4c7c7" filter="url(#soft)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="900" y="956" font-size="27" fill="#be123c" font-weight="bold" text-anchor="middle">每天看一次、跑兩週，假陽性率約是宣稱值的四倍。</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1580" y="1032" font-size="18" fill="#5b6472" font-weight="normal" text-anchor="end">資料來源：A/A 模擬，3,000 次重複</text></svg>