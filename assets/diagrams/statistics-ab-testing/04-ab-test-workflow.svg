<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" font-family="Microsoft JhengHei, 微軟正黑體, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbfcfe"/><stop offset="1" stop-color="#f3f5f9"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#27324a" flood-opacity="0.10"/>
  </filter>
  <marker id="aFaint" markerWidth="11" markerHeight="11" refX="7.5" refY="4" orient="auto">
    <path d="M0,0 L9,4 L0,8 Z" fill="#8a93a6"/>
  </marker>
  <marker id="aViolet" markerWidth="12" markerHeight="12" refX="8" refY="4.2" orient="auto">
    <path d="M0,0 L9.5,4.2 L0,8.4 Z" fill="#8b5cf6"/>
  </marker>
</defs>
<rect x="0" y="0" width="1800" height="1500" fill="url(#bg)"/>
<rect x="1" y="1" width="1798" height="1498" rx="22" fill="none" stroke="#e9ecf3"/>

<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="72" y="78" font-size="22" font-weight="bold" letter-spacing="3" fill="#0f766e">實驗流程</text>
<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="70" y="132" font-size="46" font-weight="bold" fill="#1f2430">A/B 測試流程與把關點</text>
<text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="72" y="172" font-size="22" fill="#5b6472">把決策規則先凍結，再用 SRM 與護欄指標守住實驗品質</text>
<rect x="90" y="225" width="1010" height="132" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M108,225 h974 a18,18 0 0 1 18,18 v6 h-1010 v-6 a18,18 0 0 1 18,-18 z" fill="#0ea5e9"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="287" font-size="27" font-weight="bold" fill="#0369a1">1. 定義假設與指標</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="328" font-size="20" fill="#5b6472">主要指標只能一個；護欄指標 3–5 個</text><rect x="90" y="405" width="1010" height="132" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M108,405 h974 a18,18 0 0 1 18,18 v6 h-1010 v-6 a18,18 0 0 1 18,-18 z" fill="#6366f1"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="467" font-size="27" font-weight="bold" fill="#4338ca">2. 事前登記</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="508" font-size="20" fill="#5b6472">凍結假設、MDE、樣本數、決策規則</text><rect x="90" y="585" width="1010" height="132" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M108,585 h974 a18,18 0 0 1 18,18 v6 h-1010 v-6 a18,18 0 0 1 18,-18 z" fill="#8b5cf6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="647" font-size="27" font-weight="bold" fill="#6d28d9">3. 隨機分派</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="688" font-size="20" fill="#5b6472">分派單位＝分析單位；用穩定 hash</text><rect x="90" y="1005" width="1010" height="132" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M108,1005 h974 a18,18 0 0 1 18,18 v6 h-1010 v-6 a18,18 0 0 1 18,-18 z" fill="#f59e0b"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="1067" font-size="27" font-weight="bold" fill="#b45309">4. 跑滿不偷看</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="1108" font-size="20" fill="#5b6472">跑到預定樣本數才分析</text><rect x="90" y="1245" width="1010" height="132" rx="18" fill="#ffffff" stroke="#e6e8ef" filter="url(#soft)"/><path d="M108,1245 h974 a18,18 0 0 1 18,18 v6 h-1010 v-6 a18,18 0 0 1 18,-18 z" fill="#14b8a6"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="1307" font-size="27" font-weight="bold" fill="#0f766e">5. 分析與決策</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="116" y="1348" font-size="20" fill="#5b6472">看信賴區間下界，不只看 p 值</text><line x1="595" y1="365" x2="595" y2="395" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="595" y1="545" x2="595" y2="575" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><line x1="595" y1="725" x2="595" y2="780" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/><path d="M595,778 L775,840 L595,902 L415,840 Z" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="4" filter="url(#soft)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="595" y="836" font-size="26" fill="#6d28d9" font-weight="bold" text-anchor="middle">SRM 檢查</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="595" y="872" font-size="21" fill="#5b6472" font-weight="normal" text-anchor="middle">（開跑 24 小時內）</text><path d="M595,902 L595,977" fill="none" stroke="#14b8a6" stroke-width="4" marker-end="url(#aFaint)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="625" y="950" font-size="21" fill="#0f766e" font-weight="bold" text-anchor="start">通過</text><path d="M775,840 L1185,840" fill="none" stroke="#f43f5e" stroke-width="4" marker-end="url(#aFaint)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="955" y="818" font-size="21" fill="#be123c" font-weight="bold" text-anchor="middle">不通過</text><rect x="1215" y="772" width="500" height="136" rx="18" fill="#fdeaea" stroke="#f4c7c7" stroke-width="3" filter="url(#soft)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1465" y="828" font-size="25" fill="#be123c" font-weight="bold" text-anchor="middle">停止實驗，</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1465" y="866" font-size="25" fill="#be123c" font-weight="bold" text-anchor="middle">找分派/記錄的 bug</text><rect x="1170" y="1010" width="545" height="122" rx="18" fill="#fef5e1" stroke="#f4dca6" stroke-width="3" filter="url(#soft)"/><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1198" y="1054" font-size="22" fill="#b45309" font-weight="bold" text-anchor="start">中途只看護欄指標，</text><text font-family="Microsoft JhengHei, 微軟正黑體, sans-serif" x="1198" y="1092" font-size="22" fill="#b45309" font-weight="bold" text-anchor="start">用來止損不用來宣告勝利</text><line x1="1100" y1="1071" x2="1158" y2="1071" stroke="#f59e0b" stroke-width="4" stroke-dasharray="9 7"/><line x1="595" y1="1145" x2="595" y2="1235" stroke="#8a93a6" stroke-width="2.4" marker-end="url(#aFaint)"/></svg>