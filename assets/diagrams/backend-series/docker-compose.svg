<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="compose-title compose-desc" font-family="Geist, Noto Sans CJK TC, Microsoft JhengHei, sans-serif" id="docker-compose-root">
<title id="compose-title">Compose 服務配置</title>
<desc id="compose-desc">本機用 127.0.0.1:8000 呼叫 app 容器；app 在 Compose 網路內用服務名稱 postgres:5432 連資料庫；postgres 的資料存在 pgdata volume。</desc>
<defs>
      <style>#docker-compose-root .diagram-container { width:100%;overflow-x:auto }</style>
<marker id="docker-compose-compose-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#8a93a6"/></marker>
<marker id="docker-compose-compose-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#b45309"/></marker>
</defs>
<rect width="1280" height="600" fill="#fbfcfe"/>
<text x="40" y="56" font-size="32" font-weight="600" fill="#1f2430">兩個容器、一個 volume</text>

<!-- zones -->
<rect x="40" y="96" width="1200" height="424" rx="8" fill="#f3f5f9" stroke="#e6e8ef"/>
<text x="56" y="124" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.08em" fill="#5b6472">你的電腦</text>
<rect x="384" y="144" width="816" height="208" rx="8" fill="#fbfcfe" stroke="#e6e8ef" stroke-dasharray="4,4"/>
<text x="400" y="172" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.08em" fill="#5b6472">COMPOSE 網路</text>

<!-- connectors -->
<path d="M 256 248 H 398" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#docker-compose-compose-arrow)"/>
<path d="M 640 248 H 878" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#docker-compose-compose-arrow-accent)"/>
<path d="M 1000 296 V 398" fill="none" stroke="#8a93a6" stroke-width="2" marker-end="url(#docker-compose-compose-arrow)"/>
<rect x="264" y="212" width="112" height="20" rx="2" fill="#f3f5f9"/>
<text x="320" y="228" font-size="12" font-family="'Geist Mono', monospace" fill="#1f2430" text-anchor="middle">127.0.0.1:8000</text>
<rect x="696" y="212" width="128" height="20" rx="2" fill="#fbfcfe"/>
<text x="760" y="228" font-size="16" font-family="'Geist Mono', monospace" fill="#b45309" text-anchor="middle">postgres:5432</text>
<rect x="1008" y="364" width="192" height="20" rx="2" fill="#f3f5f9"/>
<text x="1012" y="380" font-size="12" font-family="'Geist Mono', monospace" fill="#5b6472">/var/lib/postgresql/data</text>

<!-- nodes -->
<g data-node="client"><rect x="56" y="200" width="200" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
<text x="156" y="244" font-size="20" font-weight="600" fill="#1f2430" text-anchor="middle">curl／瀏覽器</text>
<text x="156" y="272" font-size="16" font-family="'Geist Mono', monospace" fill="#5b6472" text-anchor="middle">host</text></g>

<g data-node="app"><rect x="400" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
<text x="520" y="244" font-size="20" font-weight="600" fill="#1f2430" text-anchor="middle">app</text>
<text x="520" y="272" font-size="16" font-family="'Geist Mono', monospace" fill="#5b6472" text-anchor="middle">job-assistant:local</text></g>

<g data-node="postgres"><rect x="880" y="200" width="240" height="96" rx="6" fill="#ffffff" stroke="#bfc0c0"/>
<text x="1000" y="244" font-size="20" font-weight="600" fill="#1f2430" text-anchor="middle">postgres</text>
<text x="1000" y="272" font-size="16" font-family="'Geist Mono', monospace" fill="#5b6472" text-anchor="middle">postgres:17</text></g>

<g data-node="volume"><rect x="880" y="400" width="240" height="80" rx="6" fill="#ffffff" stroke="#8a93a6"/>
<text x="1000" y="436" font-size="20" font-weight="600" fill="#1f2430" text-anchor="middle">volume</text>
<text x="1000" y="462" font-size="16" font-family="'Geist Mono', monospace" fill="#5b6472" text-anchor="middle">pgdata</text></g>

<!-- legend -->
<line x1="40" y1="548" x2="1240" y2="548" stroke="#e6e8ef" stroke-width="1"/>
<text x="40" y="580" font-size="12" font-family="'Geist Mono', monospace" letter-spacing="0.14em" fill="#5b6472">LEGEND</text>
<path d="M 132 574 H 180" stroke="#b45309" stroke-width="2" marker-end="url(#docker-compose-compose-arrow-accent)"/><text x="192" y="580" font-size="16" fill="#5b6472">容器之間用服務名稱連線</text>
<rect x="432" y="564" width="28" height="20" rx="4" fill="#fbfcfe" stroke="#e6e8ef" stroke-dasharray="4,4"/><text x="472" y="580" font-size="16" fill="#5b6472">Compose 自動建立的網路</text>
</svg>
